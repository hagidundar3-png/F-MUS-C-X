<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F(MUSIC)X</title>
<style>
:root{
  --bg:#000; --panel:#121212; --panel2:#181818; --hover:#1f1f1f;
  --text:#fff; --muted:#a1a1a1; --accent:#a855f7; --accent2:#ec4899;
  --border:#222; --player:#0a0a0a;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#333; border-radius:6px;}

/* MOBİL İÇİN GENEL DÜZEN */
.app{display:flex; height:calc(100vh - 90px);}

/* SIDEBAR (MASAÜSTÜ) */
.sidebar{width:240px; background:var(--bg); padding:18px 12px; display:flex; flex-direction:column; gap:4px; border-right:1px solid var(--border); flex-shrink:0;}
.logo{font-size:22px; font-weight:900; letter-spacing:-1px; padding:6px 12px 18px;
  background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.nav-item{display:flex; align-items:center; gap:14px; padding:10px 12px; border-radius:8px; color:var(--muted); font-weight:600; font-size:14px; transition:.15s;}
.nav-item:hover, .nav-item.active{color:#fff; background:var(--hover);}
.nav-item svg{width:22px; height:22px; flex-shrink:0;}
.nav-sep{height:1px; background:var(--border); margin:12px 8px;}
.nav-title{color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1.5px; padding:14px 12px 6px;}

/* MAIN */
.main{flex:1; overflow-y:auto; background:var(--panel); border-radius:12px; margin:8px 8px 0 0; position:relative;}
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:16px; padding:14px 24px;
  background:rgba(18,18,18,.85); backdrop-filter:blur(14px); border-bottom:1px solid var(--border);}
.search-box{flex:0 0 380px; position:relative;}
.search-box svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted);}
.search-box input{width:100%; padding:11px 14px 11px 42px; border-radius:30px; border:1px solid transparent;
  background:#2a2a2a; color:#fff; font-size:14px; outline:none; transition:.2s;}
.search-box input:focus{background:#333; border-color:#555;}
.topbar .spacer{flex:1;}
.user-chip{display:flex; align-items:center; gap:10px; padding:5px 14px 5px 5px; background:#000; border-radius:30px; font-size:13px; font-weight:700;}
.avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;}

#main{overflow-y:auto; height:calc(100% - 61px); padding:24px;}
.section{margin-bottom:36px;}
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:16px;}
.section-head h2{font-size:22px; font-weight:800;}
.section-head .sub{color:var(--muted); font-size:13px; margin-top:4px;}

/* KARTLAR VE LİSTELER */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px;}
.card{background:var(--panel2); border-radius:10px; padding:12px; cursor:pointer; transition:.2s; position:relative;}
.card:hover{background:var(--hover); transform:translateY(-2px);}
.card .cover{aspect-ratio:1/1; border-radius:8px; margin-bottom:12px; display:flex; align-items:center; justify-content:center; font-size:34px; position:relative;}
.card .title{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .artist{color:var(--muted); font-size:12px; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .play-fab{position:absolute; bottom:14px; right:12px; width:42px; height:42px; border-radius:50%;
  background:var(--accent); display:flex; align-items:center; justify-content:center; opacity:0; transform:translateY(8px); transition:.2s; box-shadow:0 6px 20px rgba(168,85,247,.5);}
.card:hover .play-fab{opacity:1; transform:translateY(0);}

.tracklist{display:flex; flex-direction:column;}
.trow{display:grid; grid-template-columns:32px 1fr 1fr 90px 120px; align-items:center; gap:12px;
  padding:9px 12px; border-radius:6px; cursor:pointer; transition:.12s; font-size:14px;}
.trow:hover{background:var(--hover);}
.trow .idx{color:var(--muted); text-align:center; font-size:13px;}
.trow .tname{display:flex; align-items:center; gap:12px; min-width:0;}
.trow .tcover{width:40px; height:40px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px;}
.trow .tinfo{min-width:0;}
.trow .tinfo .tt{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.trow .tinfo .ta{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.trow .tgenre{color:var(--muted); font-size:12px;}
.trow .tdur{color:var(--muted); font-size:12px; text-align:right;}
.trow .tactions{display:flex; gap:6px; justify-content:flex-end; opacity:0; transition:.15s;}
.trow:hover .tactions{opacity:1;}
.ibtn{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:.15s;}
.ibtn:hover{color:#fff; background:rgba(255,255,255,.1);}
.ibtn svg{width:16px; height:16px;}
.ibtn.liked{color:var(--accent2);}
.trow.playing .idx{color:var(--accent);}
.trow.playing .tt{color:var(--accent);}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.chip{padding:7px 16px; border-radius:20px; background:#2a2a2a; font-size:13px; font-weight:600; color:#ddd; transition:.15s; cursor:pointer;}
.chip:hover{background:#3a3a3a;}
.chip.active{background:var(--accent); color:#fff;}

.empty{color:var(--muted); text-align:center; padding:60px 20px; font-size:15px;}

/* PLAYER */
.player{position:fixed; bottom:0; left:0; right:0; height:90px; background:var(--player); border-top:1px solid var(--border);
  display:grid; grid-template-columns:1fr 2fr 1fr; align-items:center; padding:0 20px; gap:20px; z-index:100;}
.p-left{display:flex; align-items:center; gap:14px; min-width:0;}
.p-cover{width:56px; height:56px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px;}
.p-info{min-width:0;}
.p-info .pt{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.p-info .pa{color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.p-center{display:flex; flex-direction:column; align-items:center; gap:8px;}
.p-controls{display:flex; align-items:center; gap:20px;}
.p-btn{color:#bbb; transition:.15s; display:flex; align-items:center; justify-content:center;}
.p-btn:hover{color:#fff;}
.p-btn svg{width:20px; height:20px;}
.p-play{width:40px; height:40px; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; transition:.15s;}
.p-play:hover{transform:scale(1.06);}
.p-play svg{width:22px; height:22px;}
.p-progress{display:flex; align-items:center; gap:10px; width:100%; max-width:600px; font-size:11px; color:var(--muted);}
.seek{flex:1; height:4px; background:#4d4d4d; border-radius:2px; cursor:pointer; position:relative;}
.seek .fill{height:100%; background:#fff; border-radius:2px; width:0%; transition:width .1s linear;}
.seek:hover .fill{background:var(--accent);}
.p-right{display:flex; align-items:center; justify-content:flex-end; gap:14px;}
.vol{width:100px; height:4px; background:#4d4d4d; border-radius:2px; cursor:pointer; position:relative;}
.vol .fill{height:100%; background:#fff; border-radius:2px;}

/* AÇILIR PENCERE (MODAL) */
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center; justify-content:center; z-index:200;}
.modal-bg.show{display:flex;}
.modal{background:#1c1c1c; border:1px solid #333; border-radius:12px; padding:24px; width:340px; max-width:90vw;}
.modal h3{margin-bottom:16px; font-size:18px;}
.modal .pl-list{max-height:200px; overflow-y:auto; margin-bottom:16px;}
.modal .pl-item{padding:10px 14px; border-radius:8px; cursor:pointer; font-size:14px; display:flex; justify-content:space-between;}
.modal .pl-item:hover{background:#2a2a2a;}
.modal input{width:100%; padding:11px 14px; border-radius:8px; border:1px solid #333; background:#0d0d0d; color:#fff; outline:none; margin-bottom:10px;}
.modal .btn{width:100%; padding:11px; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:14px;}
.modal .btn:hover{background:#9333ea;}

.toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px); background:#2a2a2a; padding:12px 22px; border-radius:30px; font-size:14px; font-weight:600; opacity:0; transition:.3s; pointer-events:none; z-index:300; border:1px solid #444;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* 📱 MOBİL EKRAN DÜZELTMELERİ (Senin ekran görüntüsündeki bozukluğu çözer) */
@media (max-width: 768px) {
  .app { flex-direction: column; height: calc(100vh - 130px); }
  .sidebar { 
    width: 100%; height: 60px; flex-direction: row; position: fixed; bottom: 90px; 
    justify-content: space-around; padding: 0; border-right: none; border-top: 1px solid var(--border); z-index: 99; 
  }
  .logo { display: none; }
  .nav-title, .nav-sep { display: none; }
  .nav-item { flex-direction: column; font-size: 10px; gap: 3px; padding: 6px; flex: 1; text-align: center; justify-content: center; border-radius: 0; }
  .nav-item svg { width: 18px; height: 18px; }
  .main { margin: 0; border-radius: 0; height: 100%; padding-bottom: 20px; }
  .topbar { padding: 10px; gap: 10px; }
  .search-box { flex: 1; }
  .user-chip { display: none; }
  #main { padding: 16px; height: calc(100% - 60px); }
  
  .trow { grid-template-columns: 24px 1fr 40px; gap: 8px; padding: 8px; }
  .trow .tgenre, .trow .tdur { display: none; }
  .trow .tactions { opacity: 1; }
  
  .player { grid-template-columns: 1fr auto; padding: 0 12px; gap: 10px; height: 80px; }
  .p-left { gap: 10px; }
  .p-cover { width: 44px; height: 44px; }
  .p-info .pt { font-size: 13px; }
  .p-info .pa { font-size: 11px; }
  .p-center { position: fixed; bottom: 10px; right: 12px; flex-direction: row; gap: 0; }
  .p-controls { gap: 16px; }
  .p-progress { display: none; }
  .p-btn#btnShuffle, .p-btn#btnRepeat { display: none; }
  .p-right { display: none; }
  .section-head h2 { font-size: 18px; }
}
</style>
</head>
<body>

const store = {

const main = document.getElementById('main');

let ac;

    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
